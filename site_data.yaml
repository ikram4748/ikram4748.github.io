title: M. Ikram Ullah | AI/ML Engineer & Data Scientist
tagline: I build LLM agents, RAG systems and AI products that people use, and I measure whether they work.
intro: >-
  AI/ML engineer and data scientist in Islamabad, finishing an MS in Data Science at Quaid-e-Azam University. I have
  built 30+ projects for clients and for my portfolio, from VSARA, a healthcare platform live on Google Play with an
  AI assistant, to agents, RAG systems, computer vision and classic data science. I like systems that take real
  actions safely, evaluations with held-out splits and confidence intervals, and results reported honestly, including
  what did not work. Open to onsite and hybrid roles in Islamabad/Rawalpindi and remote roles anywhere.

projects:
  - name: VSARA Healthcare Platform
    category: [agents, rag]
    blurb: Four connected healthcare apps on Google Play for patients, doctors and pharmacies. Patients talk to an AI assistant by text or voice that answers from medical content, helps with triage and books appointments.
    highlights: ["Live on Google Play (Malaysia region)", "LLM chat + voice (speech-to-text, text-to-speech) + RAG", "A/B tests: +23% diagnostic response accuracy; error rate -18%"]
    tags: [React Native, LLM, RAG, voice, n8n agents]
    repo: ""
    link: https://play.google.com/store/apps/details?id=com.vsarapatientapp
    link_label: Google Play
    links: [["SARA Life (patients)", "https://play.google.com/store/apps/details?id=com.vsarapatientapp"], ["SARA Care (doctors)", "https://play.google.com/store/apps/details?id=com.vsaradoctorapp"], ["SARA Pharmacy", "https://play.google.com/store/apps/details?id=com.vsarapharmacyapp"], ["Flexa", "https://play.google.com/store/apps/details?id=com.flexaSARA"], ["Chatbot demo video", "https://lnkd.in/p/d5A5T3us"]]
    note: "Built at Syslab Technologies. The apps are published for Malaysia only, so the store pages do not open from other countries; the demo video shows the assistant working."
    status: live
  - name: Data Analyst Agent
    category: [agents, data]
    blurb: Ask a database a question in plain English. The agent links the schema, writes SQL, runs it read-only, catches silent mistakes and fixes its own query.
    highlights: ["60.7% → 66.7% execution accuracy on held-out BIRD questions", "+6.0 points, 95% CI [+1.3, +11.3]", "1.09 LLM calls per question"]
    tags: [LangGraph, text-to-SQL, Gemini, DuckDB, evaluation]
    repo: https://github.com/ikram4748/data-analyst-agent
    status: done
  - name: Customer-Ops Agent with Guardrails
    category: [agents]
    blurb: "A support agent that cancels orders and issues refunds behind a gateway the model cannot talk its way past: policy in code, customer confirmation, human approval and idempotent refunds."
    highlights: ["Held-out: 100% task success, 0 policy violations (30 scenarios)", "Prompt-only agent, same model: 3 violations incl. a double refund", "Gateway stopped 3 policy breaks and 2 duplicate refunds"]
    tags: [LLM agents, guardrails, human-in-the-loop, function calling]
    repo: https://github.com/ikram4748/customer-ops-agent
    status: done
  - name: Literature Review Agents
    category: [agents, research]
    blurb: A team of agents searches arXiv and OpenAlex and writes a short review where every sentence is cited, every finding quotes its source verbatim, and a critic checks the citations.
    highlights: ["Held-out: 97% of sentences supported, same as a one-call baseline", "Citation precision 87% vs 80%, but the 95% CI includes zero, at 6× the calls", "Judge fixed: wrong-citation catch rate 48% → 90%"]
    tags: [multi-agent, LangGraph, research, citations]
    repo: https://github.com/ikram4748/research-assistant-agent
    status: done
  - name: Financial RAG Lab
    category: [rag, research]
    blurb: Which RAG choices actually matter? Chunking, metadata filters, BM25 vs dense vs hybrid, cross-encoder reranking and HyDE, measured on the exact evidence page in 84 company filings.
    highlights: ["Answer accuracy: naive RAG 24% → best config 47% → +HyDE 61%", "+14 points from HyDE, 95% CI [+5, +23]; oracle 84%", "Dense beat BM25, hybrid and reranking in all 45 configs"]
    tags: [RAG, retrieval, reranking, HyDE, benchmarking]
    repo: https://github.com/ikram4748/financial-rag-lab
    status: done
  - name: E-mail Experiment & Uplift Modeling
    category: [data]
    blurb: "A full readout of a 64,000-customer randomized experiment: validity checks, effects with honest uncertainty, CUPED, peeking, uplift models and a dollar-valued targeting decision."
    highlights: ["Men's e-mail: +$0.77 spend per customer (95% CI $0.49–$1.05)", "Peeking 10 times → 18% false positives", "Blanket sending beats targeting below ~$0.23/e-mail"]
    tags: [A/B testing, causal inference, uplift, LightGBM]
    repo: https://github.com/ikram4748/uplift-ab-testing
    status: done
  - name: Qanoon Assist
    category: [rag]
    blurb: A legal-information assistant for Pakistani statutes in English, Urdu and Roman Urdu, citing the exact section behind every sentence.
    highlights: ["6,664 laws · 117,365 sections from 5 government portals", "Hybrid BM25 + BGE-M3 + reranker", "hit@5 1.00, faithfulness 0.944"]
    tags: [RAG, Urdu NLP, FastAPI, React]
    repo: ""
    note: Private repository; demo video on request.
    status: done

